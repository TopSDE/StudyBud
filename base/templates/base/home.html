{% extends 'main.html' %}

{% block content %}
<h1>Home Template</h1>

<div>
    <a href="{% url 'create-roomURL' %}">Create Room</a>

    {% for room in rooms %}
    <div>
        <a href="{% url 'update-roomURL' room.id %}">Edit</a>
        <a href="{% url 'delete-roomURL' room.id %}">Delete</a>
        <span>@{{room.host.username}}</span>

        <h2> {{room.id}} -- 
            <a href = "{% url 'roomURL' room.id %}">{{room.name}}</a> 
        </h2>

        <small>{{room.topic.name}}</small>

        <hr>
    </div>
    {% endfor %}
    
</div>

{% endblock %}
